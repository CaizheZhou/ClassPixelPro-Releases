name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '私有仓库要构建的 Tag（如 2.1.2.16）'
        required: true
        type: string

concurrency:
  group: build-${{ inputs.tag_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build_and_Pack
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ inputs.tag_name }}
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: CaizheZhou/ClassPixelPro
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ format('refs/tags/{0}', inputs.tag_name) }}
          fetch-depth: 0
          submodules: recursive

      # 更新日志维护在本仓库根目录的 CHANGELOG.md，而上面 checkout 的是私有仓库 tag，
      # 读不到它，所以这里额外取一份本仓库的 main
      - name: Checkout changelog source
        uses: actions/checkout@v4
        with:
          repository: CaizheZhou/ClassPixelPro-Releases
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          path: changelog-source
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build and assemble dist 📦
        shell: pwsh
        run: pwsh -File ./pack.ps1 -Version $env:RELEASE_TAG -DistDir ci-dist

      - name: Collect zip into workspace
        shell: pwsh
        run: |
          Move-Item "../ClassPixelPro_$($env:RELEASE_TAG)_windows-x64.zip" ./ -Force
          Get-ChildItem *.zip

      - name: Generate release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $date = Get-Date -Format "yyyy-MM-dd HH:mm"
          $changelogPath = 'changelog-source/CHANGELOG.md'
          $notes = ""
          if (Test-Path $changelogPath) {
            $content = Get-Content $changelogPath -Raw -Encoding UTF8
            $pattern = "## \[$([regex]::Escape($tag))\][^\r\n]*\r?\n([\s\S]*?)(?=\r?\n## \[|\Z)"
            $m = [regex]::Match($content, $pattern)
            if ($m.Success) { $notes = $m.Groups[1].Value.Trim() }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Release $tag" }
          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.AppendLine("# 📋ClassPixelPro v$tag")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("> **发布日期：** $date")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("> **⚠️注意：该版本更新重启后可能会要求更新 .NET 环境，按照提示下载更新即可继续正常使用~⚠️⚠️⚠️**")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine($notes)
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("## 校验和与下载链接")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("**下载时请注意核对文件 SHA512 是否正确。**")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("| 文件名 | SHA512 |")
          [void]$sb.AppendLine("|--------|--------|")
          Get-ChildItem ./*.zip | ForEach-Object {
            $sha = (Get-FileHash $_.FullName -Algorithm SHA512).Hash.ToUpper()
            [void]$sb.AppendLine("| $($_.Name) | $sha |")
          }
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("---")
          [void]$sb.AppendLine()
          $dateShort = Get-Date -Format "yyyy/M/d"
          [void]$sb.AppendLine("> 📌 **版本号**：$tag  ")
          Get-ChildItem ./*.zip | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 1)
            [void]$sb.AppendLine("> 📦 **文件**：``$($_.Name)``（$sizeMB MB）  ")
          }
          [void]$sb.AppendLine("> 📅 **日期**：$dateShort  ")
          $sb.ToString() | Set-Content -Path release_notes.md -Encoding UTF8
          Write-Host "===== Generated release notes ====="
          Get-Content release_notes.md -Raw
          Write-Host "=================================="

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $zips = (Get-ChildItem ./*.zip).FullName
          if (gh release view $tag --repo $env:GH_REPO 2>$null) {
            Write-Host "Release $tag already exists, deleting and recreating"
            gh release delete $tag --repo $env:GH_REPO --yes
          }
          gh release create $tag $zips --repo $env:GH_REPO `
            --title "ClassPixelPro $tag" `
            --notes-file release_notes.md `
            --latest

      - name: Publish to website backend
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          WEBSITE_API_URL: ${{ secrets.WEBSITE_API_URL }}
          WEBSITE_ADMIN_USER: ${{ secrets.WEBSITE_ADMIN_USER }}
          WEBSITE_ADMIN_PASS: ${{ secrets.WEBSITE_ADMIN_PASS }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $apiUrl = $env:WEBSITE_API_URL
          Write-Host "Logging in to website backend..."
          $loginBody = @{ username = $env:WEBSITE_ADMIN_USER; password = $env:WEBSITE_ADMIN_PASS } | ConvertTo-Json
          $loginResp = Invoke-RestMethod -Uri "$apiUrl/api/auth/login" -Method POST -Body $loginBody -ContentType "application/json; charset=utf-8"
          $token = $loginResp.token
          Write-Host "Login successful, token length: $($token.Length)"
          $zip = Get-ChildItem ./*.zip | Select-Object -First 1
          $archiveUrl = "https://gh-proxy.com/https://github.com/$env:GH_REPO/releases/download/$tag/$($zip.Name)"
          $archiveSize = $zip.Length
          $changelog = Get-Content release_notes.md -Raw -Encoding UTF8
          $parts = $tag.Split('.')
          $friendlyVersion = $tag
          $friendlyVersionShort = if ($parts.Length -ge 3) { "$($parts[0]).$($parts[1]).$($parts[2])" } else { $tag }
          Write-Host "Creating distribution via API..."
          Write-Host "  version: $tag"
          Write-Host "  archiveUrl: $archiveUrl"
          Write-Host "  archiveSize: $archiveSize"
          Write-Host "  friendlyVersion: $friendlyVersion"
          Write-Host "  friendlyVersionShort: $friendlyVersionShort"
          $createBody = @{
            version = $tag
            changelog = $changelog
            archiveUrl = $archiveUrl
            archiveSize = $archiveSize
            friendlyVersion = $friendlyVersion
            friendlyVersionShort = $friendlyVersionShort
          } | ConvertTo-Json -Depth 5
          $headers = @{ Authorization = "Bearer $token" }
          $createResp = Invoke-RestMethod -Uri "$apiUrl/api/admin/distributions/create-with-url" -Method POST -Body $createBody -ContentType "application/json; charset=utf-8" -Headers $headers
          Write-Host "Distribution created successfully: $($createResp | ConvertTo-Json)"
